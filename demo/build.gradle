import vg.skye.shinkansen.prod.RemapJar

buildscript {
	repositories {
		mavenCentral()
		maven { url "https://maven.fabricmc.net/" }
		//maven { url "https://repo.sleeping.town/" } //commented out
	}
	dependencies {
		classpath "vg.skye:shinkansen:0.5"
	}
}
apply plugin: "java"
apply plugin: "vg.skye.shinkansen"

repositories {
	maven { url "https://maven.fabricmc.net/" }
	maven {
		name "NeoForge"
		url "https://maven.neoforged.net/releases"
	}
}

configurations {
	mappings
}

dependencies {
	mappings "de.oceanlabs.mcp:mcp_config:1.20.1"
	mappings "net.fabricmc:intermediary:1.20.1:v2"
}

//Put Minecraft onto the `compileOnly` configuration, the easy way:
shinkansen {
	version("1.20.1")

	//for local testing of minivan; makes it not cache anything
	//refreshDependencies = true

	//explainHashes = true

	accessWideners "./botania_xplat.accesswidener"
}

def mc = shinkansen.getMinecraft("1.20.1")
tasks.register("remapJarSrg", RemapJar) {
	libraries.from(mc.minecraft)
	mappings.from(
			mc.vanilla.clientMappings,
			mc.vanilla.serverMappings,
			configurations.mappings
	)
	input = tasks.jar.archiveFile
	sourceMapping = "named"
	destMapping = "virtual-srg"

	classifier "srg"
}
tasks.register("remapJarIntermediary", RemapJar) {
	libraries.from(mc.minecraft)
	mappings.from(
			mc.vanilla.clientMappings,
			mc.vanilla.serverMappings,
			configurations.mappings
	)
	input = tasks.jar.archiveFile
	sourceMapping = "named"
	destMapping = "intermediary"

	classifier "intermediary"
}