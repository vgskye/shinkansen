name: Build and smoketest

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Compile the plugin, upload to Actions
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.4.2

      - name: Build
        run: ./gradlew clean build --info --stacktrace

      - name: Upload artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs

  compile_samples:
    name: Compile demo
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: git checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.4.2

      - name: Build
        run: ./demo/gradlew clean build --info --stacktrace

  publish_snapshot:
    name: Publish `-SNAPSHOT` artifact to Sleeping Town maven
    runs-on: ubuntu-latest
    needs: compile_samples
    #security is my passion (ideally pull_request actions won't fire this?? reh)
    if: (github.event_name == 'push' && github.ref_name == 'trunk')
    environment: publishing
    steps:
      - name: git checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.4.2

      - name: Publish with Gradle
        run: ./gradlew publish --info --stacktrace -Ppublish-username=${{secrets.PUBLISH_USERNAME}} -Ppublish-password=${{secrets.PUBLISH_PASSWORD}}